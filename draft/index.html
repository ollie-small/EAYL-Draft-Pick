<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Pick App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Draft Pick App</h1>
    <main class="container">
        <section id="team-management">
            <h2>Teams</h2>
            <div class="limit-controls">
                <label for="team-limit-input">Team Limit:</label>
                <input type="number" id="team-limit-input" min="2" max="99" value="8" />
            </div>
            <form id="add-team-form">
                <input type="text" id="team-name-input" placeholder="Enter team name" required />
                <button type="submit">Add Team</button>
            </form>
            <div id="team-feedback" aria-live="polite"></div>
            </form>
            <ul id="team-list"></ul>
        </section>

        <section id="people-management">
        <h2>Participants</h2>
        <div class="limit-controls">
            <label for="participant-limit-input">Participant Limit:</label>
            <input type="number" id="participant-limit-input" min="2" max="999" value="32" />
        </div>
        <form id="add-person-form">
            <input type="text" id="person-name-input" placeholder="Enter participant name" required />
            <button type="submit">Add Participant</button>
        </form>
        <div id="person-feedback" aria-live="polite"></div>
        </form>
    <ul id="person-list"></ul>
    </section>

    <section id="draft-controls">
        <!-- Draft controls will go here, disabled until 2+ teams and 2+ participants -->
        <button id="start-draft-btn" disabled>Start Draft</button>
        <p id="draft-warning" style="color: #c00; display: none; margin-top: 0.5em; font-size: 1em;"></p>
    </section>
    <section id="draft-results-section" style="display:none; margin-top:2em;">
        <h2>Draft Results</h2>
        <div id="draft-results"></div>
    <button id="reveal-next-btn" class="edit-action-btn" style="margin-top:1em; display:none;">Reveal Next</button>
    <button id="restart-draft-btn" style="margin-top:1em;">Restart Draft</button>
    </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
